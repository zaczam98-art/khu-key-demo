<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7B6CF6" />
    <meta name="description" content="먼저 질문하는 AI 커리어 메이트, 쿠키. 흩어진 경험을 경험 카드로 정리하고 직무 탐색, 자소서, 면접까지 이어서 써요." />
    <!-- 홈 화면 추가(iOS) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="쿠키" />
    <!-- 링크 공유 미리보기. 절대 주소는 vite.config.ts 의 VITE_SITE_URL 로 채워집니다.
         카카오톡 등은 이미지를 주소별로 캐시하므로, 그림을 바꿀 때는 파일 이름(og-cover-N.png)도 같이 바꿉니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:site_name" content="KHU:KEY" />
    <meta property="og:title" content="쿠키 | KHU:KEY" />
    <meta property="og:description" content="먼저 질문하는 AI 커리어 메이트, 쿠키. 경험 카드로 직무 탐색부터 자소서, 면접까지." />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%icons/og-cover.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="800" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <title>쿠키 | KHU:KEY</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
